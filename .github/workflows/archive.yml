name: Newsletter archive — keep 12

# Publishing contract:
# ausgaben/YYYY-MM/index.html and local images belong to one monthly issue.
# Upload all files first, then publish.json LAST:
# {"title":"November 2026","files":["index.html","foto-1.jpg"]}
# Folders without publish.json are drafts and are not published or counted.
# Deleted issues remain recoverable in Git history. No history is rewritten.
on:
  push:
    branches: [main]
    paths: ['ausgaben/**', '.github/workflows/archive.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate, test retention, and build archive
        shell: python
        run: |
          import json, re, shutil, tempfile, html
          from pathlib import Path
          from datetime import datetime

          def build(root, output):
              issues = []
              if root.is_symlink():
                  raise ValueError('Issue root must not be a symlink')
              for folder in root.iterdir() if root.exists() else []:
                  if not (folder / 'publish.json').exists():
                      continue
                  if folder.is_symlink() or not folder.is_dir():
                      raise ValueError('Invalid issue folder')
                  if not re.fullmatch(r'[0-9]{4}-[0-9]{2}', folder.name):
                      raise ValueError('Issue folder must use YYYY-MM')
                  datetime.strptime(folder.name, '%Y-%m')
                  if any(p.is_symlink() for p in folder.rglob('*')):
                      raise ValueError('Symlinks are not allowed in issues')
                  meta = json.loads((folder / 'publish.json').read_text(encoding='utf-8'))
                  title = meta.get('title')
                  files = meta.get('files')
                  if not isinstance(title, str) or not title.strip():
                      raise ValueError('Missing issue title')
                  if not isinstance(files, list) or 'index.html' not in files:
                      raise ValueError('Manifest must include index.html and all images')
                  if len(files) != len(set(files)):
                      raise ValueError('Duplicate manifest entries')
                  for name in files:
                      if not isinstance(name, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]*', name):
                          raise ValueError('Invalid asset filename')
                      if '..' in Path(name).parts or name == 'publish.json':
                          raise ValueError('Invalid asset path')
                      if not (folder / name).is_file() or (folder / name).stat().st_size == 0:
                          raise ValueError('Missing or empty file: ' + str(folder / name))
                  issues.append((folder, title, files))
              issues.sort(key=lambda item: item[0].name, reverse=True)
              kept, expired = issues[:12], issues[12:]
              output.mkdir(parents=True, exist_ok=True)
              for folder, title, files in kept:
                  for name in files:
                      dest = output / 'ausgaben' / folder.name / name
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(folder / name, dest)
              links = ''.join('<li><a href="ausgaben/' + f.name + '/">' + html.escape(t) + '</a></li>' for f, t, _ in kept)
              body = '<ul>' + links + '</ul>' if kept else '<p>Hier finden Sie bald unsere Newsletter.</p>'
              style = 'body{max-width:760px;margin:70px auto;padding:0 24px;font:19px/1.6 Georgia,serif;color:#282522;background:#faf8f4}h1{font-size:38px;line-height:1.2}a{color:#793640}li{padding:12px 0;border-bottom:1px solid #ddd}ul{list-style:none;padding:0}small{color:#68615a}'
              page = '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter-Archiv · Museum Wolfenbüttel</title><style>' + style + '</style><main><small>SCHLOSS MUSEUM · BÜRGER MUSEUM</small><h1>Newsletter-Archiv</h1><p>Museum Wolfenbüttel</p>' + body + '<p><small>Die letzten zwölf Ausgaben unseres Newsletters.</small></p></main></html>'
              (output / 'index.html').write_text(page, encoding='utf-8')
              (output / '.nojekyll').touch()
              (output / '404.html').write_text('<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ausgabe nicht verfügbar</title><h1>Diese Ausgabe ist nicht mehr verfügbar.</h1><p>Unser Archiv enthält die letzten zwölf Ausgaben.</p><a href="/newsletter-archiv/">Zum Newsletter-Archiv</a></html>', encoding='utf-8')
              # Delete only validated issue directories, after the new site has built.
              for folder, _, _ in expired:
                  shutil.rmtree(folder)
                  print('Removed expired issue:', folder.name)
              return [f.name for f, _, _ in kept]

          # Real filesystem tests in temporary folders; no test issues are published.
          for count in (0, 12, 13, 15):
              with tempfile.TemporaryDirectory() as temp:
                  base = Path(temp)
                  root = base / 'ausgaben'
                  root.mkdir()
                  names = []
                  for i in range(count):
                      name = f'{2025 + i // 12:04d}-{i % 12 + 1:02d}'
                      names.append(name)
                      folder = root / name
                      folder.mkdir()
                      (folder / 'index.html').write_text('<p>Test</p>')
                      (folder / 'photo.jpg').write_bytes(b'test fixture')
                      (folder / 'publish.json').write_text(json.dumps({'title': name, 'files': ['index.html', 'photo.jpg']}))
                  draft = root / 'draft'
                  draft.mkdir()
                  (draft / 'index.html').write_text('Unpublished')
                  kept = build(root, base / 'site')
                  assert kept == sorted(names, reverse=True)[:12]
                  assert draft.exists() and not (base / 'site/ausgaben/draft').exists()
                  assert len(list(root.glob('*/publish.json'))) == min(count, 12)
                  for name in names[:-12] if count > 12 else []:
                      assert not (root / name).exists()
                  if count:
                      # A broken upload must fail before deleting any further issue.
                      missing = root / kept[0] / 'photo.jpg'
                      missing.unlink()
                      before = sorted(p.name for p in root.iterdir())
                      try:
                          build(root, base / 'invalid-site')
                      except ValueError:
                          pass
                      else:
                          raise AssertionError('Missing image was accepted')
                      assert before == sorted(p.name for p in root.iterdir())
          print('Retention tests passed: 0, 12, 13, 15 issues; drafts; incomplete uploads.')
          build(Path('ausgaben'), Path('_site'))
      - name: Save removal of expired issues
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ausgaben ]; then
            git add -u -- ausgaben/
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Keep the latest 12 newsletter issues'
            # No force push: a concurrent editor upload must never be overwritten.
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish archive
        id: deployment
        uses: actions/deploy-pages@v4
